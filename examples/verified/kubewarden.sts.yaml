      1a354cb0f8d:
        spec:
          display:
            name: Total accepted requests by $policy_name policy
            description: ""
          plugin:
            kind: TimeSeriesChart
            spec:
              legend:
                mode: list
                position: right
                show: true
                values: []
              thresholds:
                mode: absolute
                steps: []
              visual:
                connectNulls: false
              yAxis:
                format:
                  decimalPlaces: 2
                show: true
          queries:
            - kind: TimeSeriesQuery
              spec:
                plugin:
                  kind: PrometheusTimeSeriesQuery
                  spec:
                    query: sum(kubewarden_policy_evaluations_total{accepted="true",mutated="false"})
